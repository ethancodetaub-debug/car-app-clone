<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Paddock Garage</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&family=Saira+Condensed:wght@600;700&display=swap">
<style>
/* Layout: one phone-width column (max 430px) with a fixed header, a scrolling body and a floating pill nav; detail sheets slide up inside the column. Dark single-look, papaya accent set from JS. */
:root{
  color-scheme:dark;
  --bg:#07080a; --panel:#14161a; --panel-2:#1b1e23; --line:#262a31; --line-2:#363b44;
  --fg:#f3f1ed; --mute:#8d939c; --dim:#5a606a;
  --accent:#ff7a00; --accent-ink:#111;
  --ok:#3ddc97; --warn:#ffb020; --bad:#ff5a4f;
  --font-display:'Saira Condensed','Arial Narrow',Impact,sans-serif;
  --font-body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-label:'Barlow Condensed','Arial Narrow',sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:400 15px/1.4 var(--font-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;overflow:hidden;position:relative}
body::before{content:"";position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(60% 38% at 50% 0%,color-mix(in srgb,var(--accent) 15%,transparent),transparent 70%),radial-gradient(50% 30% at 85% 100%,color-mix(in srgb,var(--accent) 9%,transparent),transparent)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
button:focus-visible,[role=button]:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,p{margin:0}
.app{position:relative;width:100%;max-width:430px;height:100%;margin:0 auto;display:flex;flex-direction:column;overflow:hidden}
#screen{flex:1;min-height:0;display:flex;flex-direction:column}
#screen.enter .scroll{animation:rise .32s cubic-bezier(.2,.7,.2,1)}
.top{flex:none;height:60px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.ttl{display:flex;align-items:center;gap:10px;font:600 14px var(--font-label);letter-spacing:.2em}
.ttl.center{flex:1;justify-content:center}
.ttl svg{color:var(--accent)}
.scroll{flex:1;min-height:0;overflow-y:auto;padding-bottom:104px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.rbtn{width:42px;height:42px;border-radius:50%;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;position:relative;flex:none}
.rbtn.sm{width:34px;height:34px}
.rbtn.ghost{background:none;border-color:transparent}
.rbtn:active{background:var(--panel-2)}
.dot{position:absolute;top:9px;right:10px;width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px var(--panel)}
.tools{display:flex;justify-content:flex-end;gap:10px;margin-bottom:12px}
.lbl{font:600 11px/1.1 var(--font-label);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.mut{color:var(--mute)}
.ic{flex:none}
/* cards */
.car-card{position:relative;overflow:hidden;background:linear-gradient(180deg,#181b20,#0f1114);border:1px solid var(--line);border-radius:24px;padding:18px 16px 14px;margin-bottom:14px;cursor:pointer;transition:transform .2s,border-color .2s}
.car-card.active{border-color:color-mix(in srgb,var(--accent) 55%,var(--line))}
.car-card:active{transform:scale(.985)}
.nick{position:absolute;top:14px;right:14px;font:600 10.5px var(--font-label);letter-spacing:.16em;text-transform:uppercase;color:var(--mute);border:1px solid var(--line-2);border-radius:99px;padding:4px 9px}
.wm{display:grid;gap:5px;text-align:center}
.wm .b{font:600 11px var(--font-label);letter-spacing:.5em;padding-left:.5em;color:var(--mute);text-transform:uppercase}
.wm .m{font:italic 700 38px/1 var(--font-display);letter-spacing:.02em;text-transform:uppercase;background:linear-gradient(180deg,#fff 15%,var(--accent) 130%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
.stage{position:relative;margin:8px 0 4px}
.stage::before{content:"";position:absolute;inset:8% 4% 0;background:radial-gradient(closest-side,color-mix(in srgb,var(--accent) 18%,transparent),transparent);filter:blur(10px)}
.car{position:relative;display:block;width:100%;height:auto;overflow:visible}
.car .beam,.car .glow{opacity:0;transition:opacity .3s}
.car.lit .beam,.car.lit .glow{opacity:1}
.car .spin{transform-box:fill-box;transform-origin:center}
.flash .car .beam,.flash .car .glow{animation:blink .3s linear 4}
.scanning .car .spin{animation:spin .7s linear infinite}
.scan{position:absolute;top:0;bottom:0;left:-30%;width:30%;opacity:0;pointer-events:none;background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--accent) 55%,transparent),transparent)}
.scanning .scan{opacity:1;animation:sweep 1.1s ease-in-out infinite}
.health{text-align:center;font:600 13px var(--font-label);letter-spacing:.2em;text-transform:uppercase;display:flex;justify-content:center;align-items:center;gap:6px;margin:6px 0 14px}
.health .ok svg{color:var(--ok)}
.health .w{color:var(--warn);display:flex;align-items:center;gap:6px}
.health .okt{display:flex;align-items:center;gap:6px}
.health .okt svg{color:var(--ok)}
.gauges{display:grid;grid-template-columns:1fr 1fr;gap:18px;border-top:1px solid var(--line);padding-top:14px}
.seg{display:flex;gap:3px;margin-bottom:9px}
.seg i{flex:1;height:8px;background:#30343b;transform:skewX(-22deg);border-radius:1px}
.seg i.on{background:var(--fg)}
.seg.w i.on{background:var(--warn)}
.g-val{font:700 24px/1 var(--font-display);letter-spacing:.03em}
.g-val small{font:600 12px var(--font-label);letter-spacing:.12em;margin-left:4px;color:var(--mute)}
.g-cap{display:flex;align-items:center;gap:6px;margin-top:6px;color:var(--mute)}
.upd-t{display:flex;align-items:center;gap:6px;justify-content:center;font:500 10.5px var(--font-label);letter-spacing:.14em;color:var(--dim);margin-top:14px}
.add{width:100%;height:56px;border:1px dashed var(--line-2);border-radius:20px;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--mute);font:600 13px var(--font-label);letter-spacing:.16em;text-transform:uppercase}
.add:active{background:var(--panel)}
/* vehicle check */
.subrow{display:flex;align-items:center;justify-content:space-between}
.upd{display:flex;align-items:center;gap:7px;font:500 11px var(--font-label);letter-spacing:.14em;color:var(--mute);min-height:40px}
.stage-lg{margin:4px 0 18px}
.scanmsg{text-align:center;height:16px;margin-top:-10px;margin-bottom:12px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:20px 22px;margin:0 4px 26px}
.tile{display:block;width:100%}
.tile .t-l{display:flex;align-items:center;gap:8px;color:var(--mute);font:600 11px var(--font-label);letter-spacing:.16em;text-transform:uppercase}
.tile .t-v{display:flex;align-items:center;gap:7px;margin-top:8px;font:700 24px/1 var(--font-display);letter-spacing:.04em}
.tile .t-v svg{color:var(--ok)}
.tile .t-s{font:500 11px var(--font-label);letter-spacing:.1em;color:var(--dim);margin-left:auto;text-transform:uppercase}
.tile .ln{position:relative;height:2px;background:var(--line-2);margin-top:10px}
.tile .ln::after{content:"";position:absolute;inset:0 auto 0 0;width:42%;background:var(--accent)}
.tile.warn .t-v{color:var(--warn)}
.tile.warn .t-v svg{color:var(--warn)}
.tile.warn .ln::after{width:100%;background:var(--warn)}
.shorts{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.sbtn{display:grid;justify-items:center;gap:8px;position:relative}
.sbtn .sq{width:100%;max-width:60px;aspect-ratio:1;border-radius:15px;background:var(--panel-2);border:1px solid var(--line);display:grid;place-items:center;transition:border-color .2s}
.sbtn.sel .sq{border-color:var(--accent);color:var(--accent)}
.sbtn:active .sq{background:var(--line)}
.sbtn .lbl{font-size:10px;letter-spacing:.08em;text-align:center}
.sbtn .bd{position:absolute;top:-3px;right:calc(50% - 33px);width:10px;height:10px;border-radius:50%;background:var(--bad);border:2px solid var(--bg)}
.loc{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;margin-top:20px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:13px 16px}
.loc b{display:flex;align-items:center;gap:8px;font:500 15px var(--font-body);min-width:0}
.loc b span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* home */
.hello{font:600 15px/1.2 var(--font-label);letter-spacing:.2em;text-transform:uppercase;color:var(--mute);margin:4px 0 16px}
.hello span{display:block;font:700 34px/1.05 var(--font-display);letter-spacing:.02em;color:var(--fg);margin-top:4px;overflow-wrap:anywhere}
.qgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.q{display:grid;align-content:space-between;gap:16px;min-height:96px;padding:13px;background:var(--panel);border:1px solid var(--line);border-radius:18px;transition:background .2s,border-color .2s}
.q b{display:block;font:700 15px var(--font-display);letter-spacing:.06em;text-transform:uppercase}
.q span{display:block;font:500 11px var(--font-label);letter-spacing:.1em;color:var(--mute);text-transform:uppercase;margin-top:2px}
.q.on{background:color-mix(in srgb,var(--accent) 15%,var(--panel));border-color:color-mix(in srgb,var(--accent) 60%,var(--line))}
.q.on svg{color:var(--accent)}
.q:active{transform:scale(.97)}
.cabin{display:flex;align-items:center;justify-content:space-between;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:12px 14px;margin-bottom:14px}
.cabin.off{opacity:.55}
.step{display:flex;align-items:center;gap:12px}
.step b{font:700 24px var(--font-display);min-width:58px;text-align:center;font-variant-numeric:tabular-nums}
.nxt{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px 16px;width:100%}
.nxt h3{font:700 18px var(--font-display);letter-spacing:.04em;text-transform:uppercase;margin-top:4px}
/* events */
.chips{display:flex;gap:8px;margin:0 0 14px;overflow-x:auto;scrollbar-width:none}
.chip{flex:none;height:36px;padding:0 15px;border-radius:99px;border:1px solid var(--line-2);font:600 12px var(--font-label);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.ev{display:grid;grid-template-columns:54px 1fr auto;gap:14px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:14px;margin-bottom:10px}
.dt{display:grid;justify-items:center;gap:2px;padding:8px 0;border-radius:14px;background:var(--panel-2);font:600 10px var(--font-label);letter-spacing:.14em;color:var(--mute)}
.dt b{font:700 24px/1 var(--font-display);color:var(--fg);letter-spacing:0}
.evb{min-width:0}
.evb h3{font:700 18px/1.1 var(--font-display);letter-spacing:.04em;text-transform:uppercase;overflow-wrap:anywhere}
.evb p{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--mute);margin-top:5px}
.tags{display:flex;gap:10px;align-items:center;margin-top:8px;flex-wrap:wrap;font-size:12px;color:var(--mute)}
.tag{font:700 10px var(--font-label);letter-spacing:.16em;padding:3px 7px;border-radius:6px;background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)}
.rsvp{height:38px;padding:0 14px;border-radius:12px;border:1px solid var(--line-2);font:700 12px var(--font-label);letter-spacing:.14em;text-transform:uppercase;display:flex;align-items:center;gap:6px}
.rsvp.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.evx{display:grid;gap:8px;justify-items:end}
.xdel{font:500 11px var(--font-label);letter-spacing:.1em;color:var(--dim);text-transform:uppercase;min-height:28px}
.empty{padding:36px 10px;text-align:center;color:var(--mute)}
/* nav */
.nav{position:absolute;left:0;right:0;bottom:12px;margin:0 auto;width:min(100%,340px);height:64px;display:grid;grid-template-columns:repeat(3,1fr);padding:6px;gap:4px;border-radius:22px;background:rgba(20,22,26,.78);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid var(--line-2);box-shadow:0 14px 40px rgba(0,0,0,.55);z-index:5}
.nav button{display:grid;justify-items:center;align-content:center;gap:4px;border-radius:16px;color:var(--mute);font:600 10.5px var(--font-label);letter-spacing:.16em;text-transform:uppercase;text-align:center;position:relative}
.nav button.on{color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
/* sheets */
.layer{position:absolute;inset:0;z-index:30;display:none}
.layer.open{display:block}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.62)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:90%;overflow-y:auto;background:var(--panel);border:1px solid var(--line-2);border-bottom:0;border-radius:26px 26px 0 0;padding:8px 18px 28px;scrollbar-width:none}
.sheet::-webkit-scrollbar{display:none}
.sheet.in{animation:up .3s cubic-bezier(.2,.8,.2,1)}
.grab{width:40px;height:4px;border-radius:4px;background:var(--line-2);margin:0 auto 10px}
.sh-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:16px}
.sh-h h2{font:700 24px/1.1 var(--font-display);letter-spacing:.05em;text-transform:uppercase}
.sh-h p{font-size:13px;margin-top:3px}
.sec{font:600 11px var(--font-label);letter-spacing:.18em;text-transform:uppercase;color:var(--mute);margin:22px 0 10px}
.big{font:700 56px/1 var(--font-display);margin-bottom:12px}
.big small{font-size:22px;color:var(--mute);margin-left:4px}
.rows{display:grid;margin:16px 0}
.row{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}
.row span{color:var(--mute)}
.row b{font-weight:500;text-align:right;overflow-wrap:anywhere}
.row b.ok{color:var(--ok)}.row b.warn{color:var(--warn)}.row b.bad{color:var(--bad)}
button.row{width:100%;align-items:center}
.cta{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:48px;margin-top:10px;border-radius:14px;background:var(--accent);color:var(--accent-ink);font:700 14px var(--font-label);letter-spacing:.14em;text-transform:uppercase;text-decoration:none;text-align:center}
.cta.ghost{background:var(--panel-2);color:var(--fg);border:1px solid var(--line-2)}
.cta.danger{background:color-mix(in srgb,var(--bad) 18%,var(--panel-2));color:var(--bad);border:1px solid color-mix(in srgb,var(--bad) 50%,var(--line))}
.trow{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}
.trow b{font-weight:500;font-size:14px}
.trow p{font-size:12px;color:var(--mute);margin-top:2px}
.sw{flex:none;width:50px;height:30px;border-radius:99px;background:var(--line-2);position:relative;transition:background .2s}
.sw i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s}
.sw.on{background:var(--accent)}
.sw.on i{transform:translateX(20px)}
.seg2{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--panel-2);border:1px solid var(--line);border-radius:14px;padding:4px}
.seg2 button{min-height:40px;border-radius:10px;text-align:center;font:700 12px var(--font-label);letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.seg2 button.on{background:var(--accent);color:var(--accent-ink)}
.hint{font-size:13px;color:var(--mute);margin-top:10px}
.sws{display:flex;flex-wrap:wrap;gap:10px}
.swc{width:38px;height:38px;border-radius:50%;background:var(--c);border:2px solid var(--line-2);position:relative;display:grid;place-items:center;cursor:pointer}
.swc.sel{border-color:#fff;box-shadow:0 0 0 2px var(--panel) inset}
.swc.cust{background:conic-gradient(from 0deg,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00);overflow:hidden}
.swc.cust svg{color:#fff;mix-blend-mode:difference}
.swc.cust input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;border:0;padding:0}
.fld{display:grid;gap:6px;margin-bottom:12px}
.fld input,.fld select{width:100%;height:46px;border-radius:12px;background:var(--panel-2);border:1px solid var(--line-2);color:var(--fg);padding:0 14px;font:inherit}
.fld input[type=range]{padding:0;height:34px;accent-color:var(--accent)}
.fld .vr{display:flex;justify-content:space-between;align-items:baseline}
.fld output{font:600 14px var(--font-label);letter-spacing:.08em;color:var(--fg)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bar{height:8px;border-radius:6px;background:var(--panel-2);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--fg);border-radius:6px}
.bar.w i{background:var(--warn)}
.fl-row{margin-bottom:14px}
.fl-row div{display:flex;justify-content:space-between;font-size:14px}
.tyres{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
.tyre{background:var(--panel-2);border:1px solid var(--line);border-radius:16px;padding:12px}
.tyre.warn{border-color:var(--warn)}
.tyre b{display:block;font:700 22px var(--font-display);margin:6px 0 8px;font-variant-numeric:tabular-nums}
.tyre.warn b{color:var(--warn)}
.tyre .stp{display:flex;gap:6px}
.tyre .stp button{flex:1;height:36px;border-radius:10px;background:var(--panel);border:1px solid var(--line-2);display:grid;place-items:center}
.modes{display:grid;gap:8px;margin-top:8px}
.mode{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px;border-radius:16px;background:var(--panel-2);border:1px solid var(--line)}
.mode.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--panel-2))}
.mode b{font:700 18px var(--font-display);letter-spacing:.06em;text-transform:uppercase}
.mode p{font-size:12.5px;color:var(--mute)}
.map{width:100%;height:auto;border-radius:18px;display:block;border:1px solid var(--line)}
.sdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:8px}
.sdot.warn{background:var(--warn)}.sdot.bad{background:var(--bad)}
.ni{display:flex;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.ni b{display:block;font-weight:500}
.ni p{font-size:13px;color:var(--mute)}
.err{color:var(--bad);font-size:13px;min-height:18px}
#toast{position:absolute;top:66px;left:50%;transform:translate(-50%,-14px);max-width:90%;padding:10px 16px;border-radius:99px;background:#f3f1ed;color:#111;font:600 13px var(--font-label);letter-spacing:.08em;text-transform:uppercase;text-align:center;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:50}
#toast.show{opacity:1;transform:translate(-50%,0)}
.spin-once{animation:spin .6s linear}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes sweep{to{left:100%}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}

/* Premium finish */
:root{--line:#292d35;--line-2:#414752;--panel:#15181d;--panel-2:#1d2229}
body{background:radial-gradient(ellipse at 50% -15%,#252a32 0%,#101216 42%,#07080a 78%)}
.app{background:linear-gradient(180deg,rgba(19,22,27,.98),rgba(8,10,13,.99));border-inline:1px solid rgba(255,255,255,.055);box-shadow:0 28px 90px rgba(0,0,0,.48)}
.top{height:66px;padding-inline:4px;border-bottom:1px solid rgba(255,255,255,.045);margin-bottom:14px}
.ttl{font-size:13px;letter-spacing:.24em}
.rbtn{background:linear-gradient(145deg,#20242b,#14171c);box-shadow:inset 0 1px rgba(255,255,255,.045),0 5px 16px rgba(0,0,0,.18)}
.car-card{background:linear-gradient(145deg,#20242b 0%,#12151a 68%,#0d0f12 100%);border-color:#303640;box-shadow:0 14px 34px rgba(0,0,0,.2),inset 0 1px rgba(255,255,255,.04)}

var U={screen:'garage',sheet:null,filter:'all',confirm:null,scanning:false,flash:false,evErr:''};
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function car(){return S.cars[S.activeCar];}

/* derived values */
var metric=function(){return S.units==='metric';};
var dist=function(v){return metric()?Math.round(v):Math.round(v*0.621371);};
var distU=function(){return metric()?'km':'mi';};
var press=function(b){return metric()?b.toFixed(1)+' bar':Math.round(b*14.5038)+' psi';};
var tmp=function(c){return metric()?Math.round(c)+'°C':Math.round(c*9/5+32)+'°F';};
var range=function(c){return Math.round(c.fuel/100*c.maxRange);};
var battStatus=function(c){return c.battery<10?'CRITICAL':c.battery<20?'LOW':'OK';};
var tyreLow=function(c){return Object.keys(c.tyres).filter(function(k){return c.tyres[k]<2.0;});};
function issues(c){
  var l=[];['drive','lights','adas','fluids'].forEach(function(k){if(c.status[k]!=='ok'){l.push(k);}});
  if(c.battery<20){l.push('battery');}
  if(tyreLow(c).length){l.push('tyres');}
  if(Math.min(c.pads.front,c.pads.rear)<15){l.push('brakes');}
  return l;
}
function notifs(){
  var c=car(),l=[];
  if(c.battery<20){l.push({t:'Battery low',b:c.battery+'% remaining. Charge soon.',lv:'bad'});}
  var lt=tyreLow(c);
  if(lt.length){l.push({t:'Tyre pressure low',b:lt.map(function(k){return TY[k];}).join(', ')+' below 2.0 bar.',lv:'warn'});}
  ['drive','lights','adas','fluids'].forEach(function(k){if(c.status[k]!=='ok'){l.push({t:SYS[k]+' needs attention',b:'Open the vehicle check for details.',lv:'warn'});}});
  if(c.serviceKm<2000){l.push({t:'Service due soon',b:dist(c.serviceKm)+' '+distU()+' until your next service.',lv:'info'});}
  l.push({t:'Software 4.2.1',b:'Your vehicle software is up to date.',lv:'info'});
  return l;
}
function sig(){return notifs().map(function(n){return n.t;}).join('|');}
function unread(){return notifs().some(function(n){return n.lv!=='info';})&&S.readSig!==sig();}
function agoText(ts){
  var m=Math.floor((now()-ts)/60000);
  if(m<1){return 'JUST NOW';}
  if(m<60){return m+(m===1?' MINUTE AGO':' MINUTES AGO');}
  var h=Math.floor(m/60);
  return h<24?h+(h===1?' HOUR AGO':' HOURS AGO'):Math.floor(h/24)+' DAYS AGO';
}
var updLine=function(c){return '<span class="upd-t">UPDATED <span data-ago="'+c.updatedAt+'">'+agoText(c.updatedAt)+'</span></span>';};
var seg=function(p,w){var n=Math.round(p/100*20),h='';for(var i=0;i<20;i++){h+='<i'+(i<n?' class="on"':'')+'></i>';}return '<div class="seg'+(w?' w':'')+'" aria-hidden="true">'+h+'</div>';};
function fmtDate(iso){return new Date(iso+'T00:00:00');}

 return '<header class="top"><div class="brand-lockup"><span class="brand-mark">P</span><span class="brand-divider"></span><span class="brand-name">PADDOCK <b>GARAGE</b></span></div><button class="rbtn" data-act="sheet" data-s="profile">'+ic('sliders')+'</button></header><main class="scroll sub-screen"><div class="page-heading"><span class="eyebrow">Vehicle locator</span><h1>Find my car</h1><p>Your McLaren P1, right where you left it.</p></div><div class="find-hero"><img class="find-car-photo" src="'+P1_PHOTO+'" alt="McLaren P1"><span class="find-car-tag">Saved vehicle</span><div class="find-car-caption"><div style="display:flex;align-items:center;gap:8px"><span style="display:inline-flex;color:var(--accent)">'+ic('mclaren',20)+'</span><div><strong>McLaren P1</strong><span>Carbon black · Hybrid hypercar</span></div></div></div></div><section class="dash-card find-location"><div class="card-head"><span>Last known location</span><b class="status-pill"><i></i> Parked</b></div><h2>Paddock Garage</h2><p>4648 Villa Ridge Rd</p><div class="location-meta">Last parked <b>'+pk+'</b></div><button class="locate-cta compact" data-act="sheet" data-s="location">Open location details '+ic('chev',18)+'</button><button class="outline-action" data-act="copy">Copy address</button></section><p class="demo-note">Location and vehicle telemetry are sample data for this interactive demo.</p></main>';
}
function scrStats(){
 var c=car();
 return '<header class="top"><div class="brand-lockup"><span class="brand-mark">P</span><span class="brand-divider"></span><span class="brand-name">PADDOCK <b>GARAGE</b></span></div><button class="rbtn" data-act="refresh">'+ic('sync')+'</button></header><main class="scroll sub-screen"><div class="page-heading"><span class="eyebrow">Performance overview</span><h1>Vehicle stats</h1><p>McLaren P1 · Hybrid powertrain</p></div><section class="performance-strip stats-strip"><div><span>Top speed</span><b>217 <small>MPH</small></b></div><div><span>0–60 MPH</span><b>2.8<small>s</small></b></div><div><span>Horsepower</span><b>903 <small>HP</small></b></div><div><span>Torque</span><b>664 <small>LB-FT</small></b></div></section><section class="dash-card stats-card"><div class="card-head"><span>Live vehicle levels</span><span class="live-label"><i></i> Demo telemetry</span></div><div class="stat-line"><span>Battery</span><b>'+c.battery+'%</b></div><div class="meter"><i style="width:'+c.battery+'%"></i></div><div class="stat-line"><span>Fuel</span><b>'+c.fuel+'%</b></div><div class="meter"><i style="width:'+c.fuel+'%"></i></div><div class="stat-line"><span>Front brake pad life</span><b>'+c.pads.front+'%</b></div><div class="meter"><i style="width:'+c.pads.front+'%"></i></div><div class="stat-line"><span>Rear brake pad life</span><b>'+c.pads.rear+'%</b></div><div class="meter"><i style="width:'+c.pads.rear+'%"></i></div></section><section class="dash-card stats-card"><div class="card-head"><span>Vehicle systems</span><span class="status-pill"><i></i> '+(issues(c).length?'Attention':'All clear')+'</span></div>'+row('Drive mode',MODES[c.mode].n)+row('Lights',c.status.lights==='ok'?'Operational':'Check')+row('Driver assistance',c.status.adas==='ok'?'Operational':'Check')+row('Next service',dist(c.serviceKm)+' '+distU())+'<button class="outline-action" data-act="sheet" data-s="all">Open full diagnostics '+ic('chev',16)+'</button></section></main>';
}

/* ---------- render ---------- */
var SCREENS={home:scrGarage,garage:scrGarage,find:scrFind,stats:scrStats,check:scrCheck,events:scrEvents};
function applyAccent(){
  var r=document.documentElement.style;
  r.setProperty('--accent',S.accent);
  r.setProperty('--accent-ink',lum(S.accent)>0.45?'#111':'#fff');
}
function render(anim){
  var sc=$('#screen'),old=sc.querySelector('.scroll'),top=old?old.scrollTop:0;
  applyAccent();
  sc.innerHTML=SCREENS[U.screen]();
  var n=sc.querySelector('.scroll');
  if(anim){sc.classList.remove('enter');void sc.offsetWidth;sc.classList.add('enter');}
  else if(n){n.scrollTop=top;}
  var items=[['garage','home','Garage'],['find','pin','Find My'],['events','cal','Events'],['stats','gauge','Stats']];
  $('#nav').innerHTML=items.map(function(it){
    var on=U.screen===it[0]||(it[0]==='garage'&&U.screen==='check');
    return '<button data-act="nav" data-s="'+it[0]+'" class="'+(on?'on':'')+'"'+(on?' aria-current="page"':'')+'>'+ic(it[1],22)+it[2]+'</button>';
  }).join('');
}
function tickAgo(){
  document.querySelectorAll('[data-ago]').forEach(function(el){el.textContent=agoText(+el.getAttribute('data-ago'));});
}

/* ---------- sheets ---------- */
function head(t,s){return '<div class="sh-h"><div><h2>'+t+'</h2>'+(s?'<p class="mut">'+s+'</p>':'')+'</div><button class="rbtn sm" data-act="close" aria-label="Close">'+ic('close',18)+'</button></div>';}
function row(l,v,cls){return '<div class="row"><span>'+l+'</span><b class="'+(cls||'')+'">'+v+'</b></div>';}
function trow(label,sub,on,act,data){
  return '<div class="trow"><div><b>'+label+'</b>'+(sub?'<p>'+sub+'</p>':'')+'</div><button class="sw'+(on?' on':'')+'" role="switch" aria-checked="'+on+'" aria-label="'+label+'" data-act="'+act+'" '+data+'><i></i></button></div>';
}
function bar(l,p,warn){return '<div class="fl-row"><div><span>'+l+'</span><b style="font-weight:500">'+p+'%</b></div><div class="bar'+(warn?' w':'')+'"><i style="width:'+p+'%"></i></div></div>';}
function resolveBtn(k){
  var c=car();
  return c.status[k]!=='ok'?'<button class="cta" data-act="resolve" data-k="'+k+'">'+ic('check',18,2.2)+' Mark as resolved</button>':'';
}
function seg2(opts,cur,act,k){
  return '<div class="seg2" role="group">'+opts.map(function(o){return '<button class="'+(cur===o[0]?'on':'')+'" data-act="'+act+'" data-k="'+k+'" data-v="'+o[0]+'">'+o[1]+'</button>';}).join('')+'</div>';
}
function swatches(list,cur,k){
  cur=cur.toLowerCase();
  return '<div class="sws">'+list.map(function(p){return '<button class="swc'+(cur===p[1]?' sel':'')+'" style="--c:'+p[1]+'" data-act="set" data-k="'+k+'" data-v="'+p[1]+'" aria-label="'+p[0]+'" title="'+p[0]+'"></button>';}).join('')
   +'<label class="swc cust" title="Custom colour">'+ic('plus',14)+'<input type="color" data-bind="'+k+'" value="'+cur+'" aria-label="Custom colour"></label></div>';
}
function sheetStatus(k,label){
  var c=car(),ok=c.status[k]==='ok';
  return '<div class="rows">'+row('Status','<span class="sdot'+(ok?'':' warn')+'"></span>'+(ok?'All good':'Needs attention'),ok?'ok':'warn')+'</div>'+resolveBtn(k);
}

var SHEETS={
info:function(){
  return head('About this data','How the numbers get here')
   +'<p class="hint" style="margin:0 0 12px">This app is a working demo. Every value is stored in your browser, not read from a real vehicle, so nothing here reflects an actual car.</p>'
   +'<p class="hint" style="margin:0 0 18px">Tap any value to open its detail sheet, change it, and watch the health check respond. Use Customize in the garage to change paint, wheels, name and warnings.</p>'
   +'<button class="cta" data-act="close">Got it</button>';
},
profile:function(){
  return head('Profile','Your name and units')
   +'<div class="fld"><label class="lbl" for="in-owner">Name</label><input id="in-owner" data-bind="owner" maxlength="20" value="'+esc(S.owner)+'" autocomplete="off"></div>'
   +'<div class="sec" style="margin-top:6px">Units</div>'+seg2([['metric','Metric'],['imperial','Imperial']],S.units,'units','u')
   +'<p class="hint">Metric shows km, bar and °C. Imperial shows mi, psi and °F.</p>'
   +'<div class="sec">Data</div>'
   +'<button class="cta danger" data-act="reset">'+(U.confirm==='reset'?'Tap again to confirm reset':'Reset demo data')+'</button>';
},
menu:function(){
  return head('Garage options','')
   +'<button class="row" data-act="refresh" data-all="1"><span style="color:var(--fg)">Refresh all vehicles</span>'+ic('sync',18)+'</button>'
   +'<button class="row" data-act="sheet" data-s="customize"><span style="color:var(--fg)">Customize active vehicle</span>'+ic('chev',18)+'</button>'
   +'<button class="row" data-act="addCar"><span style="color:var(--fg)">Add vehicle</span>'+ic('plus',18)+'</button>'
   +'<button class="row" data-act="sheet" data-s="profile"><span style="color:var(--fg)">Profile and units</span>'+ic('chev',18)+'</button>';
},
notifs:function(){
  var l=notifs();
  return head('Notifications',esc(car().brand+' '+car().model))
   +l.map(function(n){return '<div class="ni"><span class="sdot'+(n.lv==='bad'?' bad':n.lv==='warn'?' warn':'')+'" style="margin-top:7px;flex:none"></span><div><b>'+esc(n.t)+'</b><p>'+esc(n.b)+'</p></div></div>';}).join('');
},
lights:function(){
  var c=car(),L=c.lamps;
  return head('Lights','Exterior and cabin')
   +sheetStatus('lights')
   +trow('Headlights','Low beam',L.head,'lamp','data-k="head"')
   +trow('Auto high beam','Dips for oncoming traffic',L.auto,'lamp','data-k="auto"')
   +trow('Daytime running lights','Always on while driving',L.drl,'lamp','data-k="drl"')
   +trow('Cabin lighting','Interior ambient light',L.cabin,'lamp','data-k="cabin"');
},
adas:function(){
  var c=car(),A=c.adas;
  return head('Driver assistance','Active safety systems')
   +sheetStatus('adas')
   +trow('Lane keeping','Steers back toward the lane centre',A.lane,'adasT','data-k="lane"')
   +trow('Adaptive cruise','Holds a set gap to the car ahead',A.acc,'adasT','data-k="acc"')
   +trow('Blind spot warning','Alerts for traffic beside you',A.blind,'adasT','data-k="blind"')
   +trow('Parking sensors','Front and rear proximity tones',A.park,'adasT','data-k="park"');
},
fluids:function(){
  var c=car(),f=c.fluid;
  return head('Fluids','Levels at last check')
   +sheetStatus('fluids')
   +'<div style="margin-top:6px">'+bar('Engine oil',f.oil,f.oil<30)+bar('Coolant',f.coolant,f.coolant<30)+bar('Brake fluid',f.brake,f.brake<30)+bar('Washer fluid',f.washer,f.washer<30)+'</div>'
   +'<button class="cta ghost" data-act="topup">'+ic('drop',18)+' Top up washer fluid</button>';
},
battery:function(){
  var c=car(),st=battStatus(c);
  return head('Battery check','Hybrid pack and 12V system')
   +'<div class="big">'+c.battery+'<small>%</small></div>'+seg(c.battery,c.battery<20)
   +'<div class="rows">'+row('Status',st,st==='OK'?'ok':'warn')+row('Electric range',dist(Math.round(c.battery*0.31))+' '+distU())+row('12V system','Healthy','ok')+row('Charge state',c.charging?'Charging':'Idle')+'</div>'
   +'<button class="cta" data-act="charge">'+ic('bolt',18)+(c.charging?' Stop charging':' Start charging')+'</button>';
},
power:function(){
  var c=car(),m=MODES[c.mode];
  var modes=Object.keys(MODES).map(function(k){
    return '<button class="mode'+(c.mode===k?' on':'')+'" data-act="mode" data-v="'+k+'"><span><b>'+MODES[k].n+'</b><p>'+MODES[k].d+'</p></span>'+(c.mode===k?ic('check',20,2.2):'')+'</button>';
  }).join('');
  return head('Power train','Engine and drive mode')
   +sheetStatus('drive')
   +'<div class="rows">'+row('Oil temperature',tmp(m.oil))+row('Coolant temperature',tmp(m.cool))+row('Engine load',m.load+'%')+'</div>'
   +'<div class="sec" style="margin-top:6px">Drive mode</div><div class="modes">'+modes+'</div>';
},
wheels:function(){
  var c=car();
  var t=Object.keys(TY).map(function(k){
    var v=c.tyres[k],w=v<2.0;
    return '<div class="tyre'+(w?' warn':'')+'"><span class="lbl">'+TY[k]+'</span><b>'+press(v)+'</b><div class="stp"><button data-act="tyre" data-p="'+k+'" data-d="-0.1" aria-label="Lower '+TY[k]+'">'+ic('minus',16)+'</button><button data-act="tyre" data-p="'+k+'" data-d="0.1" aria-label="Raise '+TY[k]+'">'+ic('plus',16)+'</button></div></div>';
  }).join('');
  return head('Wheels and brakes','Tyre pressure and pad life')
   +'<div class="tyres">'+t+'</div><p class="hint" style="margin:6px 0 16px">Recommended '+press(2.4)+' front, '+press(2.6)+' rear. Below '+press(2.0)+' triggers a warning.</p>'
   +bar('Front brake pads',c.pads.front,c.pads.front<15)+bar('Rear brake pads',c.pads.rear,c.pads.rear<15)
   +'<button class="cta ghost" data-act="tyreReset">Reset to recommended</button>';
},
all:function(){
  var c=car(),m=MODES[c.mode];
  function r(label,val,ok,s){return '<button class="row" data-act="sheet" data-s="'+s+'"><span style="color:var(--fg)"><span class="sdot'+(ok?'':' warn')+'"></span>'+label+'</span><b style="color:var(--mute)">'+val+'</b></button>';}
  return head('All systems',esc(c.brand+' '+c.model))
   +r('Drive mode',m.n,c.status.drive==='ok','power')+r('Lights',c.status.lights==='ok'?'OK':'Check',c.status.lights==='ok','lights')
   +r('ADAS',c.status.adas==='ok'?'OK':'Check',c.status.adas==='ok','adas')+r('Fluids',c.status.fluids==='ok'?'OK':'Check',c.status.fluids==='ok','fluids')
   +r('Battery',c.battery+'% · '+battStatus(c),c.battery>=20,'battery')+r('Tyres',tyreLow(c).length?'Low pressure':'OK',!tyreLow(c).length,'wheels')
   +r('Brakes',Math.min(c.pads.front,c.pads.rear)+'% pad life',Math.min(c.pads.front,c.pads.rear)>=15,'wheels')
   +row('Next service',dist(c.serviceKm)+' '+distU())+row('Software','4.2.1');
},

   +'<div class="two"><div class="fld"><label class="lbl" for="ev-date">Date</label><input id="ev-date" type="date" value="'+dayIso(1)+'" min="'+dayIso(0)+'"></div><div class="fld"><label class="lbl" for="ev-time">Time</label><input id="ev-time" type="time" value="09:00"></div></div>'
   +'<div class="fld"><label class="lbl" for="ev-place">Place</label><input id="ev-place" maxlength="40" placeholder="Meeting point" autocomplete="off"></div>'
   +'<div class="fld"><label class="lbl" for="ev-type">Type</label><select id="ev-type"><option value="tour">Tour</option><option value="track">Track</option><option value="meet">Meet</option></select></div>'
   +'<div class="err" id="ev-err" role="alert">'+esc(U.evErr)+'</div>'
   +'<button class="cta" data-act="saveEvent">Add event</button>';
},
customize:function(){
  var c=car();
  var chips=S.cars.length>1?'<div class="chips" style="margin-bottom:6px">'+S.cars.map(function(x,i){return '<button class="chip'+(i===S.activeCar?' on':'')+'" data-act="selCar" data-i="'+i+'">'+esc(x.nick||x.model)+'</button>';}).join('')+'</div>':'';
  var sys=['drive','lights','adas','fluids'].map(function(k){return trow('Warning: '+SYS[k],'Simulates a fault to see the health check react',c.status[k]!=='ok','status','data-k="'+k+'"');}).join('');
  return head('Customize','Everything saves automatically')+chips
   +'<div class="sec" style="margin-top:0">Vehicle</div>'
   +'<div class="fld"><label class="lbl" for="in-brand">Brand text</label><input id="in-brand" data-bind="brand" maxlength="16" value="'+esc(c.brand)+'" autocomplete="off"></div>'
   +'<div class="two"><div class="fld"><label class="lbl" for="in-model">Model</label><input id="in-model" data-bind="model" maxlength="14" value="'+esc(c.model)+'" autocomplete="off"></div>'
   +'<div class="fld"><label class="lbl" for="in-nick">Nickname</label><input id="in-nick" data-bind="nick" maxlength="14" value="'+esc(c.nick)+'" autocomplete="off"></div></div>'
   +'<div class="fld"><label class="lbl" for="in-location">Parked location</label><input id="in-location" data-bind="location" maxlength="60" value="'+esc(c.location)+'" autocomplete="off"></div>'
   +'<div class="sec">Paint</div>'+swatches(PAINTS,c.paint,'paint')
   +'<div class="sec">Wheels</div>'+seg2([['silver','Silver'],['black','Black'],['bronze','Bronze'],['gold','Gold'],['orange','Orange']],c.wheel,'set','wheel')
   +'<div class="sec">Brake calipers</div>'+swatches(CALIPERS,c.caliper,'caliper')
   +'<div class="sec">Side stripe</div>'+trow('Show stripe','Adds a line along the lower body',c.stripe,'stripe','')
   +(c.stripe?'<div style="margin-top:12px">'+swatches([['White','#ffffff'],['Black','#111111'],['Papaya','#ff7a00'],['Cyan','#19c6ff'],['Red','#e5171f']],c.stripeColor,'stripeColor')+'</div>':'')
   +'<div class="sec">App accent</div>'+swatches(ACCENTS,S.accent,'accent')
   +'<div class="sec">Live values</div>'
   +'<div class="fld"><div class="vr"><label class="lbl" for="in-fuel">Fuel</label><output data-out="fuel">'+c.fuel+'% · '+dist(range(c))+' '+distU()+'</output></div><input id="in-fuel" type="range" min="0" max="100" data-bind="fuel" value="'+c.fuel+'"></div>'
   +'<div class="fld"><div class="vr"><label class="lbl" for="in-battery">Battery</label><output data-out="battery">'+c.battery+'%</output></div><input id="in-battery" type="range" min="0" max="100" data-bind="battery" value="'+c.battery+'"></div>'
   +'<div class="sec">Simulate warnings</div>'+sys
   +'<div class="sec">Garage</div>'
   +'<button class="cta ghost" data-act="addCar">'+ic('plus',18)+' Add vehicle</button>'
   +'<button class="cta danger" data-act="delCar">'+(U.confirm==='delcar'?'Tap again to delete this vehicle':'Delete this vehicle')+'</button>';
}
};

function renderSheet(){
  var L=$('#layer');
  if(!U.sheet){L.classList.remove('open');L.innerHTML='';return;}
  var prev=L.querySelector('.sheet'),st=prev?prev.scrollTop:0,fresh=!L.classList.contains('open');
  var fn=SHEETS[U.sheet];
  L.innerHTML='<div class="scrim" data-act="close"></div><section class="sheet'+(fresh?' in':'')+'" role="dialog" aria-modal="true">'+'<div class="grab"></div>'+fn()+'</section>';
  L.classList.add('open');
  var s=L.querySelector('.sheet');if(s){s.scrollTop=st;}
}

/* ---------- behaviour ---------- */
var toastT,chargeT,confT;
function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('show');},2200);}
function commit(){save();render();if(U.sheet){renderSheet();}}
function go(s){
  U.screen=s;U.sheet=null;renderSheet();render(true);
  try{if(location.hash!=='#'+s){location.hash=s;}}catch(e){}
}
function beep(){
  try{
    var A=window.AudioContext||window.webkitAudioContext;if(!A){return;}
    var x=new A();
    [0,0.22].forEach(function(d){
      var o=x.createOscillator(),g=x.createGain();o.type='square';o.frequency.value=420;
      g.gain.setValueAtTime(0.0001,x.currentTime+d);
      g.gain.exponentialRampToValueAtTime(0.12,x.currentTime+d+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,x.currentTime+d+0.18);
      o.connect(g);g.connect(x.destination);o.start(x.currentTime+d);o.stop(x.currentTime+d+0.2);
    });
    setTimeout(function(){if(x.close){x.close();}},800);
  }catch(e){}
}
function flashLights(){U.flash=true;render();setTimeout(function(){U.flash=false;render();},1400);}
function stopCharge(){clearInterval(chargeT);chargeT=null;S.cars.forEach(function(c){c.charging=false;});}
function askConfirm(key){
  if(U.confirm===key){U.confirm=null;clearTimeout(confT);return true;}
  U.confirm=key;renderSheet();clearTimeout(confT);
  confT=setTimeout(function(){if(U.confirm===key){U.confirm=null;renderSheet();}},3500);
  return false;
}
function copyText(text){
  function fallback(){
    try{
      var ta=document.createElement('textarea');ta.value=text;ta.setAttribute('readonly','');ta.style.cssText='position:fixed;opacity:0;top:0;left:0';
      document.body.appendChild(ta);ta.select();var ok=document.execCommand('copy');document.body.removeChild(ta);
      toast(ok?'Address copied':'Copy blocked here');
    }catch(e){toast('Copy blocked here');}
  }
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(function(){toast('Address copied');},fallback);}
    else{fallback();}
  }catch(e){fallback();}
}

function act(a,d,el){
  var c=car();
  switch(a){
  case 'nav':go(d.s);break;
  case 'openCar':S.activeCar=+d.i;save();go('check');break;
  case 'sheet':
    U.sheet=d.s==='drive'?'power':d.s;U.confirm=null;U.evErr='';
    if(U.sheet==='notifs'){S.readSig=sig();save();render();}
    renderSheet();break;
  case 'close':U.sheet=null;U.confirm=null;renderSheet();break;
  case 'refresh':{
    var all=d.all==='1';(all?S.cars:[c]).forEach(function(x){x.updatedAt=now();});
    var sv=el&&el.querySelector('svg');if(sv){sv.classList.add('spin-once');}
    toast('Vehicle data refreshed');
    if(all){U.sheet=null;renderSheet();}
    save();render();break;}
  case 'scan':
    if(U.scanning){break;}
    U.scanning=true;render();toast('Running vehicle check');
    setTimeout(function(){
      U.scanning=false;car().updatedAt=now();save();render();
      toast(issues(car()).length?'Check complete: attention needed':'Check complete: all systems OK');
    },2600);break;
  case 'mode':c.mode=d.v;toast(MODES[d.v].n+' mode selected');commit();break;
  case 'lock':c.locked=!c.locked;toast(c.locked?'Vehicle locked':'Vehicle unlocked');commit();break;
  case 'climate':c.climate=!c.climate;toast(c.climate?'Climate on at '+tmp(c.temp):'Climate off');commit();break;
  case 'temp':c.temp=clamp(c.temp+(+d.d),16,28);commit();break;
  case 'lamp':c.lamps[d.k]=!c.lamps[d.k];if(d.k==='head'){toast(c.lamps.head?'Headlights on':'Headlights off');}commit();break;
  case 'adasT':c.adas[d.k]=!c.adas[d.k];commit();break;
  case 'horn':beep();flashLights();toast('Horn');break;
  case 'flash':flashLights();toast('Lights flashed');break;
  case 'charge':
    if(c.charging){stopCharge();toast('Charging stopped');commit();break;}
    if(c.battery>=100){toast('Battery is already full');break;}
    stopCharge();c.charging=true;
    chargeT=setInterval(function(){
      var cc=S.cars.filter(function(x){return x.charging;})[0];
      if(!cc){stopCharge();return;}
      cc.battery=Math.min(100,cc.battery+1);
      if(cc.battery>=100){stopCharge();toast('Fully charged');}
      save();render();if(U.sheet){renderSheet();}
    },350);
    toast('Charging started');commit();break;
  case 'tyre':c.tyres[d.p]=Math.round(clamp(c.tyres[d.p]+(+d.d),1.2,3.2)*10)/10;commit();break;
  case 'tyreReset':c.tyres={fl:2.4,fr:2.4,rl:2.6,rr:2.6};toast('Tyres set to recommended');commit();break;
  case 'resolve':c.status[d.k]='ok';toast('Marked as resolved');commit();break;
  case 'topup':c.fluid.washer=100;toast('Washer fluid topped up');commit();break;
  case 'status':c.status[d.k]=c.status[d.k]==='ok'?'warn':'ok';commit();break;
  case 'stripe':c.stripe=!c.stripe;commit();break;
  case 'set':
    if(d.k==='accent'){S.accent=d.v;}else{c[d.k]=d.v;}
    commit();break;
  case 'units':S.units=d.v;commit();break;
  case 'selCar':S.activeCar=+d.i;commit();break;
  case 'filter':U.filter=d.v;render();break;
  case 'rsvp':{
    var e=S.events.filter(function(x){return x.id===d.id;})[0];if(!e){break;}
    if(e.going){e.going=false;e.spots+=1;toast('RSVP cancelled');}
    else if(e.spots>0){e.going=true;e.spots-=1;toast("You're going to "+e.title);}
    else{toast('This event is full');}
    save();render();break;}
  case 'delEvent':S.events=S.events.filter(function(x){return x.id!==d.id;});toast('Event deleted');save();render();break;
  case 'saveEvent':{
    var t=$('#ev-title').value.trim(),dt=$('#ev-date').value,tm=$('#ev-time').value,pl=$('#ev-place').value.trim(),ty=$('#ev-type').value;
    var err='';
    if(!t){err='Give the event a title.';}else if(!dt){err='Pick a date.';}else if(dt<dayIso(0)){err='Choose today or a later date.';}
    if(err){U.evErr=err;var er=$('#ev-err');if(er){er.textContent=err;}break;}
    S.events.push({id:'u'+now().toString(36),title:t,type:ty,date:dt,time:tm||'09:00',place:pl||'To be announced',spots:20,going:true,custom:true});
    U.evErr='';U.sheet=null;U.filter='all';save();renderSheet();go('events');toast('Event added');break;}
  case 'addCar':{
    if(S.cars.length>=5){toast('Garage is full (5 vehicles)');break;}
    var p=PAINTS[Math.floor(Math.random()*PAINTS.length)][1];
    S.cars.push(mkCar({brand:S.cars[0].brand,model:'New model',nick:'',paint:p,location:'Home garage',updatedAt:now()}));
    S.activeCar=S.cars.length-1;U.sheet='customize';U.confirm=null;save();render();renderSheet();toast('Vehicle added');break;}
  case 'delCar':
    if(S.cars.length<=1){toast('Keep at least one vehicle');break;}
    if(!askConfirm('delcar')){break;}
    stopCharge();S.cars.splice(S.activeCar,1);S.activeCar=0;U.sheet=null;
    save();renderSheet();if(U.screen==='check'){go('garage');}else{render();}
    toast('Vehicle deleted');break;
  case 'reset':
    if(!askConfirm('reset')){break;}
    stopCharge();S=makeDefault();U.sheet=null;U.filter='all';save();renderSheet();go('garage');toast('Demo data reset');break;
  case 'copy':copyText(c.location||'');break;
  }
}

function outs(){
  var c=car();
  document.querySelectorAll('[data-out]').forEach(function(o){
    var k=o.getAttribute('data-out');
    o.textContent=k==='fuel'?c.fuel+'% · '+dist(range(c))+' '+distU():c.battery+'%';
  });
}
function onInput(e){
  var el=e.target,b=el.getAttribute&&el.getAttribute('data-bind');
  if(!b){return;}
  var c=car(),v=el.value;
  switch(b){
  case 'owner':S.owner=v.slice(0,20);break;
  case 'accent':if(isHex(v)){S.accent=v;}break;
  case 'paint':case 'caliper':case 'stripeColor':if(isHex(v)){c[b]=v;}break;
  case 'brand':c.brand=v.slice(0,16);break;
  case 'model':c.model=v.slice(0,14);break;
  case 'nick':c.nick=v.slice(0,14);break;
  case 'location':c.location=v.slice(0,60);break;
  case 'fuel':c.fuel=clamp(+v,0,100);break;
  case 'battery':c.battery=clamp(+v,0,100);break;
  }
  save();render();outs();
}

/* ---------- init ---------- */
var VALID=['home','garage','find','events','stats','check'];
function fromHash(){var h='';try{h=location.hash.replace('#','');}catch(e){}return VALID.indexOf(h)>-1?h:'garage';}
var app=$('#app');
app.addEventListener('click',function(e){
  var t=e.target.closest('[data-act]');
  if(!t){return;}
  act(t.getAttribute('data-act'),t.dataset,t);
});
app.addEventListener('input',onInput);
app.addEventListener('keydown',function(e){
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('[role=button][data-act]')){
    e.preventDefault();act(e.target.getAttribute('data-act'),e.target.dataset,e.target);
  }
  if(e.key==='Escape'&&U.sheet){U.sheet=null;U.confirm=null;renderSheet();}
});
window.addEventListener('hashchange',function(){
  var s=fromHash();
  if(s!==U.screen){U.screen=s;U.sheet=null;renderSheet();render(true);}
});
U.screen=fromHash();
render(true);
setInterval(tickAgo,30000);
})();
</script>

</body></html>
